# アクセストークンの更新：トークンは60日で切れるので、毎週月曜に更新して GitHub の Secret を書き換える
name: refresh-token

on:
  schedule:
    - cron: '0 1 * * 1'   # 毎週月曜 日本時間10時
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: トークンを更新して Secret を書き換える
        env:
          OLD_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
                   --data-urlencode "grant_type=ig_refresh_token" \
                   --data-urlencode "access_token=${OLD_TOKEN}")
          new=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$new"
          days=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("expires_in",0))//86400)')
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "トークンを更新しました（有効期限：あと${days}日）"
